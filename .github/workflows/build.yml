# Builds the FlapX binaries on GitHub's build machines:
#   - flapxd        Linux daemon (Boost, Berkeley DB, OpenSSL, miniupnpc linked in)
#   - flapx-qt      Linux GUI wallet
#   - flapx-qt.exe  Windows GUI wallet (statically linked, single .exe)
# All are built with UPnP compiled in and on by default (USE_UPNP=1).
#
# Every push builds them and keeps them as downloadable "artifacts" on the
# run's page. Pushing a version tag (e.g. v2.9.0.1) also publishes them as a
# GitHub release.

name: Build

on:
  push:
    branches: [ master, modern-linux-build ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-daemon:
    name: Linux daemon
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libdb++-dev \
            libboost-system-dev libboost-filesystem-dev libboost-program-options-dev \
            libboost-thread-dev libboost-chrono-dev libminiupnpc-dev zlib1g-dev

      - name: Build flapxd
        run: |
          cd src
          make -f makefile.unix -j"$(nproc)" USE_UPNP=1 STATIC=1
          strip flapxd

      - name: Check the binary
        run: |
          file src/flapxd
          ldd src/flapxd || true
          ./src/flapxd -? | head -n 3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: flapxd-linux-x86_64
          path: src/flapxd

  linux-qt:
    name: Linux GUI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libdb++-dev \
            libboost-system-dev libboost-filesystem-dev libboost-program-options-dev \
            libboost-thread-dev libboost-chrono-dev libminiupnpc-dev zlib1g-dev \
            qtbase5-dev qttools5-dev-tools cmake

      # Ubuntu's libqrencode-dev has no static library, so build one
      - name: Build static libqrencode
        run: |
          git clone --depth 1 --branch v4.1.1 https://github.com/fukuchi/libqrencode.git "$RUNNER_TEMP/libqrencode"
          cmake -S "$RUNNER_TEMP/libqrencode" -B "$RUNNER_TEMP/qrbuild" \
            -DBUILD_SHARED_LIBS=OFF -DWITH_TOOLS=NO -DWITH_TESTS=NO -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qrencode"
          cmake --build "$RUNNER_TEMP/qrbuild" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/qrbuild"

      - name: Build flapx-qt
        run: |
          # RELEASE=1 links Boost, Berkeley DB, OpenSSL, miniupnpc, qrencode and
          # zlib statically, so only Qt 5 and the C/C++ runtime come from the system
          qmake -qt=qt5 RELEASE=1 USE_UPNP=1 USE_QRCODE=1 "CONFIG+=release" "CONFIG-=debug_and_release" \
            "QRENCODE_INCLUDE_PATH=$RUNNER_TEMP/qrencode/include" "QRENCODE_LIB_PATH=$RUNNER_TEMP/qrencode/lib" \
            flapx-qt.pro
          make -j"$(nproc)"
          strip flapx-qt

      - name: Check the binary
        run: |
          file flapx-qt
          ldd flapx-qt
          if ldd flapx-qt | grep -Ei 'boost|libdb|libssl|libcrypto|miniupnpc|qrencode'; then
            echo "flapx-qt should not need the shared libraries listed above"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flapx-qt-linux-x86_64
          path: flapx-qt

  windows-qt:
    name: Windows GUI
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-qt5-static
            mingw-w64-x86_64-cmake

      # Berkeley DB 5.3 (Sleepycat license), the same version the Linux builds
      # use. MSYS2 only ships 6.x, which is AGPL-licensed and a DLL.
      - name: Build static Berkeley DB 5.3.28
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch v5.3.28 https://github.com/berkeleydb/libdb.git "$T/bdb"
          cd "$T/bdb"
          # Rename a function that clashes with a GCC built-in
          sed -i 's/__atomic_compare_exchange/__atomic_compare_exchange_db/g' src/dbinc/atomic.h
          cd build_unix
          # 2012-era C: build as C17 and relax GCC 14+'s stricter defaults
          export CFLAGS="-O2 -std=gnu17 -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration"
          export CXXFLAGS="-O2"
          ../dist/configure --host=x86_64-w64-mingw32 --build=x86_64-w64-mingw32 \
            --enable-mingw --enable-cxx --disable-shared --disable-replication \
            --prefix="$T/bdb-install"
          make -j"$(nproc)" libdb.a libdb_cxx.a
          make install_lib install_include
          ls "$T/bdb-install/lib" "$T/bdb-install/include"

      # MSYS2 only ships qrencode as a DLL; build a static copy so the wallet
      # stays a single self-contained .exe
      - name: Build static libqrencode
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch v4.1.1 https://github.com/fukuchi/libqrencode.git "$T/libqrencode"
          cmake -S "$T/libqrencode" -B "$T/qrbuild" -G "MSYS Makefiles" \
            -DBUILD_SHARED_LIBS=OFF -DWITH_TOOLS=NO -DWITH_TESTS=NO -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$T/qrencode"
          cmake --build "$T/qrbuild" -j"$(nproc)"
          cmake --install "$T/qrbuild"
          ls "$T/qrencode/lib"

      - name: Build LevelDB
        run: |
          cd src/leveldb
          make TARGET_OS=NATIVE_WINDOWS -j"$(nproc)" libleveldb.a libmemenv.a

      - name: Build flapx-qt.exe
        run: |
          QR="$(cygpath -m "$RUNNER_TEMP/qrencode")"
          BDB="$(cygpath -m "$RUNNER_TEMP/bdb-install")"
          /mingw64/qt5-static/bin/qmake USE_SYSTEM_DEPS=1 USE_UPNP=1 USE_QRCODE=1 \
            NO_BOOST_SYSTEM_LIB=1 "BOOST_LIB_SUFFIX=-mt" \
            "BDB_INCLUDE_PATH=$BDB/include" "BDB_LIB_PATH=$BDB/lib" \
            "QRENCODE_INCLUDE_PATH=$QR/include" "QRENCODE_LIB_PATH=$QR/lib" flapx-qt.pro
          make -j"$(nproc)"
          strip release/flapx-qt.exe

      # The .exe must run on its own: fail if it needs any DLL that isn't
      # part of Windows itself
      - name: Check the binary is self-contained
        run: |
          file release/flapx-qt.exe
          ldd release/flapx-qt.exe
          if ldd release/flapx-qt.exe | grep '=>' | grep -vi '/c/windows/'; then
            echo "flapx-qt.exe depends on non-system DLLs (listed above)"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flapx-qt-windows-x86_64
          path: release/flapx-qt.exe
