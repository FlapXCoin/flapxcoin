# Builds the FlapX binaries on GitHub's build machines:
#   - flapxd        Linux daemon (Boost, Berkeley DB, OpenSSL, miniupnpc linked in)
#   - flapx-qt      Linux GUI wallet
#   - flapx-qt.exe  Windows GUI wallet (statically linked, single .exe)
# All are built with UPnP compiled in and on by default (USE_UPNP=1).
#
# Every push builds them and keeps them as downloadable "artifacts" on the
# run's page. Pushing a version tag (e.g. v3.0.0.0) also publishes them as a
# GitHub release.

name: Build

# Documentation-only changes don't need new binaries (tag pushes always build)
on:
  push:
    branches: [ master, modern-linux-build ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', 'doc/**', 'README', 'COPYING', 'INSTALL' ]
  pull_request:
    paths-ignore: [ '**.md', 'doc/**', 'README', 'COPYING', 'INSTALL' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build files for (e.g. v3.0.0.1): rebuilds an existing release, or creates it (and the tag) on this commit; leave empty for a normal build'
        required: false
        default: ''

# A newer push to the same branch cancels a build that's still running;
# release (tag) builds are never cancelled
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Speed-ups (they don't change the binaries):
#  - ccache keeps compiled objects between runs, so only changed files are
#    recompiled. CCACHE_COMPILERCHECK=content because the compiler is
#    reinstalled on every run.
#  - Libraries we build ourselves (Berkeley DB, qrencode) are cached by
#    version. Bump the "-v1" in their cache keys after changing how they're built.
env:
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

jobs:
  linux-daemon:
    name: Linux daemon
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libdb++-dev \
            libboost-system-dev libboost-filesystem-dev libboost-program-options-dev \
            libboost-thread-dev libboost-chrono-dev libminiupnpc-dev zlib1g-dev ccache

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-daemon-${{ github.sha }}
          restore-keys: ccache-linux-daemon-

      - name: Build flapxd
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          cd src
          make -f makefile.unix -j"$(nproc)" USE_UPNP=1 STATIC=1 CXX="ccache g++" CC="ccache gcc"
          strip flapxd
          ccache -s

      - name: Check the binary
        run: |
          file src/flapxd
          ldd src/flapxd || true
          ./src/flapxd -? | head -n 3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: flapxd-linux-x86_64
          path: src/flapxd

  linux-qt:
    name: Linux GUI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libdb++-dev \
            libboost-system-dev libboost-filesystem-dev libboost-program-options-dev \
            libboost-thread-dev libboost-chrono-dev libminiupnpc-dev zlib1g-dev \
            qtbase5-dev qttools5-dev-tools cmake ccache

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-qt-${{ github.sha }}
          restore-keys: ccache-linux-qt-

      - uses: actions/cache@v4
        id: qrcache
        with:
          path: ${{ runner.temp }}/qrencode
          key: linux-qrencode-4.1.1-ubuntu22.04-v1

      # Ubuntu's libqrencode-dev has no static library, so build one
      - name: Build static libqrencode
        if: steps.qrcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v4.1.1 https://github.com/fukuchi/libqrencode.git "$RUNNER_TEMP/libqrencode"
          cmake -S "$RUNNER_TEMP/libqrencode" -B "$RUNNER_TEMP/qrbuild" \
            -DBUILD_SHARED_LIBS=OFF -DWITH_TOOLS=NO -DWITH_TESTS=NO -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qrencode"
          cmake --build "$RUNNER_TEMP/qrbuild" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/qrbuild"

      - name: Build flapx-qt
        run: |
          # RELEASE=1 links Boost, Berkeley DB, OpenSSL, miniupnpc, qrencode and
          # zlib statically, so only Qt 5 and the C/C++ runtime come from the system
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          qmake -qt=qt5 RELEASE=1 USE_UPNP=1 USE_QRCODE=1 "CONFIG+=release" "CONFIG-=debug_and_release" \
            "QMAKE_CC=ccache gcc" "QMAKE_CXX=ccache g++" "QMAKE_LINK=g++" \
            "QRENCODE_INCLUDE_PATH=$RUNNER_TEMP/qrencode/include" "QRENCODE_LIB_PATH=$RUNNER_TEMP/qrencode/lib" \
            flapx-qt.pro
          make -j"$(nproc)"
          strip flapx-qt
          ccache -s

      - name: Check the binary
        run: |
          file flapx-qt
          ldd flapx-qt
          if ldd flapx-qt | grep -Ei 'boost|libdb|libssl|libcrypto|miniupnpc|qrencode'; then
            echo "flapx-qt should not need the shared libraries listed above"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flapx-qt-linux-x86_64
          path: flapx-qt

      # Run the wallet on a virtual display and screenshot each page and
      # dialog, so GUI changes can be reviewed from the run's artifacts
      - name: Take GUI screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb xdotool imagemagick
          PRINT_SCREENSHOTS_BASE64=1 contrib/ci/gui-screenshots.sh ./flapx-qt screenshots
          PRINT_SCREENSHOTS_BASE64=1 THEME=FlappyCoin contrib/ci/gui-screenshots.sh ./flapx-qt screenshots/flappycoin
          # Космос, written the way QSettings stores non-Latin text in its .conf file
          PRINT_SCREENSHOTS_BASE64=1 THEME='\x41a\x43e\x441\x43c\x43e\x441' contrib/ci/gui-screenshots.sh ./flapx-qt screenshots/kosmos
          PRINT_SCREENSHOTS_BASE64=1 THEME=None contrib/ci/gui-screenshots.sh ./flapx-qt screenshots/none
          # The other built-in themes, a few pages each
          for t in "Mars Colony" Synthwave "Deep Sea" Winter DaGoofMan Silverwing "Flappy Night" Terminal; do
            PRINT_SCREENSHOTS_BASE64=1 QUICK=1 THEME="$t" contrib/ci/gui-screenshots.sh ./flapx-qt "screenshots/$(echo "$t" | tr -d ' ' | tr A-Z a-z)"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-linux
          path: screenshots/

  windows-qt:
    name: Windows GUI
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-qt5-static
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ccache

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-windows-qt-${{ github.sha }}
          restore-keys: ccache-windows-qt-

      - uses: actions/cache@v4
        id: depcache
        with:
          path: |
            ${{ runner.temp }}/bdb-install
            ${{ runner.temp }}/qrencode
          key: windows-deps-bdb5.3.28-qrencode4.1.1-v1

      # Berkeley DB 5.3 (Sleepycat license), the same version the Linux builds
      # use. MSYS2 only ships 6.x, which is AGPL-licensed and a DLL.
      - name: Build static Berkeley DB 5.3.28
        if: steps.depcache.outputs.cache-hit != 'true'
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch v5.3.28 https://github.com/berkeleydb/libdb.git "$T/bdb"
          cd "$T/bdb"
          # Rename a function that clashes with a GCC built-in
          sed -i 's/__atomic_compare_exchange/__atomic_compare_exchange_db/g' src/dbinc/atomic.h
          cd build_unix
          # 2012-era C: build as C17 and relax GCC 14+'s stricter defaults
          export CFLAGS="-O2 -std=gnu17 -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration"
          export CXXFLAGS="-O2"
          ../dist/configure --host=x86_64-w64-mingw32 --build=x86_64-w64-mingw32 \
            --enable-mingw --enable-cxx --disable-shared --disable-replication \
            --prefix="$T/bdb-install"
          make -j"$(nproc)" libdb.a libdb_cxx.a
          make install_lib install_include
          ls "$T/bdb-install/lib" "$T/bdb-install/include"

      # MSYS2 only ships qrencode as a DLL; build a static copy so the wallet
      # stays a single self-contained .exe
      - name: Build static libqrencode
        if: steps.depcache.outputs.cache-hit != 'true'
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch v4.1.1 https://github.com/fukuchi/libqrencode.git "$T/libqrencode"
          cmake -S "$T/libqrencode" -B "$T/qrbuild" -G "MSYS Makefiles" \
            -DBUILD_SHARED_LIBS=OFF -DWITH_TOOLS=NO -DWITH_TESTS=NO -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$T/qrencode"
          cmake --build "$T/qrbuild" -j"$(nproc)"
          cmake --install "$T/qrbuild"
          ls "$T/qrencode/lib"

      - name: Build LevelDB
        run: |
          export CCACHE_DIR="$(cygpath -m "$RUNNER_TEMP/ccache")"
          cd src/leveldb
          make TARGET_OS=NATIVE_WINDOWS -j"$(nproc)" CC="ccache gcc" CXX="ccache g++" libleveldb.a libmemenv.a

      - name: Build flapx-qt.exe
        run: |
          QR="$(cygpath -m "$RUNNER_TEMP/qrencode")"
          BDB="$(cygpath -m "$RUNNER_TEMP/bdb-install")"
          export CCACHE_DIR="$(cygpath -m "$RUNNER_TEMP/ccache")"
          /mingw64/qt5-static/bin/qmake USE_SYSTEM_DEPS=1 USE_UPNP=1 USE_QRCODE=1 \
            NO_BOOST_SYSTEM_LIB=1 "BOOST_LIB_SUFFIX=-mt" \
            "QMAKE_CC=ccache gcc" "QMAKE_CXX=ccache g++" "QMAKE_LINK=g++" \
            "BDB_INCLUDE_PATH=$BDB/include" "BDB_LIB_PATH=$BDB/lib" \
            "QRENCODE_INCLUDE_PATH=$QR/include" "QRENCODE_LIB_PATH=$QR/lib" flapx-qt.pro
          make -j"$(nproc)"
          strip release/flapx-qt.exe
          ccache -s

      # The .exe must run on its own: fail if it needs any DLL that isn't
      # part of Windows itself
      - name: Check the binary is self-contained
        run: |
          file release/flapx-qt.exe
          ldd release/flapx-qt.exe
          if ldd release/flapx-qt.exe | grep '=>' | grep -vi '/c/windows/'; then
            echo "flapx-qt.exe depends on non-system DLLs (listed above)"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flapx-qt-windows-x86_64
          path: release/flapx-qt.exe

      - name: Build flapxd.exe
        run: |
          BDB="$(cygpath -m "$RUNNER_TEMP/bdb-install")"
          export CCACHE_DIR="$(cygpath -m "$RUNNER_TEMP/ccache")"
          cd src
          make -f makefile.mingw -j"$(nproc)" CC="ccache gcc" CXX="ccache g++" \
            "BDB_INCLUDE_PATH=$BDB/include" "BDB_LIB_PATH=$BDB/lib" flapxd.exe
          strip flapxd.exe
          ldd flapxd.exe
          if ldd flapxd.exe | grep '=>' | grep -vi '/c/windows/'; then
            echo "flapxd.exe depends on non-system DLLs (listed above)"; exit 1
          fi
          ./flapxd.exe -? | head -n 3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: flapxd-windows-x86_64
          path: src/flapxd.exe

  # Ubuntu 18.04 builds, for older Linux systems: the daemon and the GUI wallet,
  # built inside an Ubuntu 18.04 container (glibc 2.27, Qt 5.9), so they run on
  # 18.04 and anything newer. GitHub no longer has 18.04 runners.
  ubuntu1804:
    name: Ubuntu 18.04 daemon + GUI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in an Ubuntu 18.04 container
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:18.04 bash contrib/ci/build-ubuntu1804.sh
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Check the binaries
        run: |
          file src/flapxd flapx-qt
          ldd flapx-qt
          # newest glibc symbol each needs (18.04 has 2.27)
          for b in src/flapxd flapx-qt; do
            objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flapxd-ubuntu18.04-x86_64
          path: src/flapxd

      - uses: actions/upload-artifact@v4
        with:
          name: flapx-qt-ubuntu18.04-x86_64
          path: flapx-qt

  # macOS: Apple Silicon and Intel, the daemon and the GUI wallet (.dmg), with
  # the libraries from Homebrew. The app is signed ad hoc (not notarised), so
  # the first time it's opened macOS asks: right-click > Open.
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_UPGRADE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install boost openssl@3 berkeley-db@5 miniupnpc qrencode ccache dylibbundler
          if [ "${{ matrix.arch }}" = arm64 ]; then
            brew install qt@5
            echo "QTDIR=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          else
            # Homebrew's Qt 5 for Intel pulls in a long chain of rebuilds; Qt's
            # own 5.15.2 binaries are Intel, so use those
            pip3 install --break-system-packages aqtinstall
            python3 -m aqt install-qt mac desktop 5.15.2 clang_64 -O "$RUNNER_TEMP/Qt"
            QTDIR="$RUNNER_TEMP/Qt/5.15.2/clang_64"
            # Qt 5.15.2 still links the AGL framework, which current macOS SDKs dropped
            sed -i '' 's/-framework AGL//g' "$QTDIR/mkspecs/common/mac.conf"
            echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"
          fi
          brew --prefix

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.arch }}-

      - name: Build flapxd
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          cd src
          make -f makefile.osx -j"$(sysctl -n hw.ncpu)" CC="ccache clang" CXX="ccache clang++"
          strip flapxd
          # Put the Homebrew libraries it needs in a libs folder next to it
          mkdir -p ../flapxd-macos/libs && cp flapxd ../flapxd-macos/
          cd ../flapxd-macos
          dylibbundler -od -b -x flapxd -d libs/ -p @executable_path/libs/
          codesign --force --sign - libs/*.dylib flapxd
          file flapxd
          otool -L flapxd
          if otool -L flapxd | tail -n +2 | grep -E '/opt/homebrew|/usr/local'; then
            echo "flapxd still points at Homebrew (listed above)"; exit 1
          fi
          ./flapxd -? | head -n 3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: flapxd-macos-${{ matrix.arch }}
          path: flapxd-macos/

      - name: Build FlapX-Qt.app
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          B="$(brew --prefix)"; Q="$QTDIR"
          DB="$(brew --prefix berkeley-db@5)"; SSL="$(brew --prefix openssl@3)"
          "$Q/bin/qmake" USE_UPNP=1 USE_QRCODE=1 NO_BOOST_SYSTEM_LIB=1 "CONFIG+=release" "CONFIG-=debug_and_release" \
            "QMAKE_CC=ccache clang" "QMAKE_CXX=ccache clang++" "QMAKE_LINK=clang++" \
            "QMAKE_LRELEASE=$Q/bin/lrelease" \
            "BOOST_INCLUDE_PATH=$B/include" "BOOST_LIB_PATH=$B/lib" \
            "BDB_INCLUDE_PATH=$DB/include" "BDB_LIB_PATH=$DB/lib" \
            "OPENSSL_INCLUDE_PATH=$SSL/include" "OPENSSL_LIB_PATH=$SSL/lib" \
            "MINIUPNPC_INCLUDE_PATH=$B/include" "MINIUPNPC_LIB_PATH=$B/lib" \
            "QRENCODE_INCLUDE_PATH=$B/include" "QRENCODE_LIB_PATH=$B/lib" flapx-qt.pro
          make -j"$(sysctl -n hw.ncpu)"
          # Copy Qt and the Homebrew libraries into the app, sign it ad hoc
          # (required on Apple Silicon) and pack it into a .dmg
          "$Q/bin/macdeployqt" FlapX-Qt.app
          codesign --force --deep --sign - FlapX-Qt.app
          otool -L FlapX-Qt.app/Contents/MacOS/FlapX-Qt
          if otool -L FlapX-Qt.app/Contents/MacOS/FlapX-Qt | tail -n +2 | grep -E '/opt/homebrew|/usr/local'; then
            echo "the app still points at Homebrew (listed above)"; exit 1
          fi
          mkdir dmg && cp -R FlapX-Qt.app dmg/ && ln -s /Applications dmg/Applications
          # hdiutil on GitHub's macOS runners sometimes fails with "Resource busy": retry
          for i in 1 2 3 4 5; do
            hdiutil create -volname "FlapX" -srcfolder dmg -ov -format UDZO "FlapX-Qt-macos-${{ matrix.arch }}.dmg" && break
            [ "$i" = 5 ] && exit 1
            echo "hdiutil failed, retrying in 15 s"; sleep 15
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flapx-qt-macos-${{ matrix.arch }}
          path: FlapX-Qt-macos-${{ matrix.arch }}.dmg

  # A version tag (e.g. v3.0.0.0) publishes the binaries as a GitHub release.
  # The 32-bit Windows build runs in build-win32.yml and adds its .exe to the
  # same release when it finishes.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [ linux-daemon, linux-qt, windows-qt, ubuntu1804, macos ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # for the release notes (doc/release-notes-<version>.md)
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/download-artifact@v4
        with:
          pattern: flapx*
          path: dist

      - name: Package the binaries
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          mkdir out
          # Each file goes in its own .zip; zip keeps the Unix executable bits
          z() { out="$PWD/out/$1"; shift; (cd "$1" && shift && zip -qry "$out" "$@"); }
          chmod +x dist/flapxd-linux-x86_64/flapxd dist/flapx-qt-linux-x86_64/flapx-qt
          z "flapxd-$TAG-linux-x86_64.zip" dist/flapxd-linux-x86_64 flapxd
          z "flapx-qt-$TAG-linux-x86_64.zip" dist/flapx-qt-linux-x86_64 flapx-qt
          z "flapx-qt-$TAG-win64.zip" dist/flapx-qt-windows-x86_64 flapx-qt.exe
          z "flapxd-$TAG-win64.zip" dist/flapxd-windows-x86_64 flapxd.exe
          chmod +x dist/flapxd-ubuntu18.04-x86_64/flapxd dist/flapx-qt-ubuntu18.04-x86_64/flapx-qt
          z "flapxd-$TAG-ubuntu18.04-x86_64.zip" dist/flapxd-ubuntu18.04-x86_64 flapxd
          z "flapx-qt-$TAG-ubuntu18.04-x86_64.zip" dist/flapx-qt-ubuntu18.04-x86_64 flapx-qt
          for a in arm64 x86_64; do
            chmod +x "dist/flapxd-macos-$a/flapxd"
            z "flapxd-$TAG-macos-$a.zip" "dist/flapxd-macos-$a" flapxd libs
            mv "dist/flapx-qt-macos-$a/FlapX-Qt-macos-$a.dmg" "dist/flapx-qt-macos-$a/FlapX-Qt-$TAG.dmg"
            z "FlapX-Qt-$TAG-macos-$a.zip" "dist/flapx-qt-macos-$a" "FlapX-Qt-$TAG.dmg"
          done
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          # Either workflow may get here first; the other one just uploads
          NOTES="repo/doc/release-notes-${TAG#v}.md"
          if [ -f "$NOTES" ]; then NOTEARGS=(--notes-file "$NOTES"); else NOTEARGS=(--generate-notes); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "FlapX $TAG" --target "$GITHUB_SHA" "${NOTEARGS[@]}" \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          # Remove this workflow's files from an earlier build that weren't zipped
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -v '\.zip$' | grep -v 'win32' \
            | while read -r f; do gh release delete-asset "$TAG" "$f" --repo "$GITHUB_REPOSITORY" -y; done
